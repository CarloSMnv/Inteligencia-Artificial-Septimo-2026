<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mapa conceptual: Paradigmas de la representación digital de la información</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #ffffff;
    margin: 0;
    padding: 24px;
    color: #1f2937;
  }
  h1 {
    text-align: center;
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 6px 0;
  }
  p.subtitle {
    text-align: center;
    font-size: 15px;
    color: #6b7280;
    margin: 0 0 24px 0;
  }
  .map-container {
    width: 100%;
    max-width: 1750px;
    margin: 0 auto;
    overflow-x: auto;
  }
  svg text {
    font-family: 'Segoe UI', Arial, sans-serif;
  }
</style>
</head>
<body>

<h1>Paradigmas de la representación digital de la información</h1>
<p class="subtitle">Mapa conceptual — fundamentos de sistemas digitales</p>

<div class="map-container">
<svg width="100%" viewBox="0 0 1700 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mapa conceptual de los paradigmas de la representación digital de la información</title>
<desc>Diagrama jerárquico con un nodo central conectado a seis paradigmas principales, cada uno con dos subconceptos.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ===================== CONECTORES ROOT -> NIVEL 1 ===================== -->
<g stroke="#9ca3af" stroke-width="1.4" fill="none">
  <path d="M850 100 L150 170"/>
  <path d="M850 100 L430 170"/>
  <path d="M850 100 L710 170"/>
  <path d="M850 100 L990 170"/>
  <path d="M850 100 L1270 170"/>
  <path d="M850 100 L1550 170"/>
</g>
<text x="850" y="135" text-anchor="middle" font-size="14" fill="#6b7280" font-style="italic">se organiza en seis paradigmas fundamentales</text>

<!-- ===================== NODO RAÍZ ===================== -->
<rect x="650" y="20" width="400" height="80" rx="14" fill="#1e3a8a" stroke="#1e293b" stroke-width="1.2"/>
<text x="850" y="52" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">Representación digital</text>
<text x="850" y="78" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">de la información</text>

<!-- ===================== NIVEL 1: 6 PARADIGMAS ===================== -->
<!-- 1. Analógico vs digital (azul) -->
<rect x="25" y="170" width="250" height="70" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="150" y="198" text-anchor="middle" font-size="16" font-weight="600" fill="#1e3a8a">Sistemas analógicos</text>
<text x="150" y="220" text-anchor="middle" font-size="16" font-weight="600" fill="#1e3a8a">y digitales</text>

<!-- 2. Numeración posicional (verde) -->
<rect x="305" y="170" width="250" height="70" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="430" y="198" text-anchor="middle" font-size="16" font-weight="600" fill="#14532d">Sistemas de numeración</text>
<text x="430" y="220" text-anchor="middle" font-size="16" font-weight="600" fill="#14532d">posicionales</text>

<!-- 3. Representación de números (morado) -->
<rect x="585" y="170" width="250" height="70" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/>
<text x="710" y="198" text-anchor="middle" font-size="16" font-weight="600" fill="#581c87">Representación</text>
<text x="710" y="220" text-anchor="middle" font-size="16" font-weight="600" fill="#581c87">de números</text>

<!-- 4. Codificación de caracteres (naranja) -->
<rect x="865" y="170" width="250" height="70" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/>
<text x="990" y="198" text-anchor="middle" font-size="16" font-weight="600" fill="#7c2d12">Codificación de</text>
<text x="990" y="220" text-anchor="middle" font-size="16" font-weight="600" fill="#7c2d12">caracteres y símbolos</text>

<!-- 5. Lógica digital (rosa/rojo) -->
<rect x="1145" y="170" width="250" height="70" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="1.4"/>
<text x="1270" y="198" text-anchor="middle" font-size="16" font-weight="600" fill="#881337">Lógica digital</text>
<text x="1270" y="220" text-anchor="middle" font-size="16" font-weight="600" fill="#881337">(Álgebra de Boole)</text>

<!-- 6. Unidades de medida (teal) -->
<rect x="1425" y="170" width="250" height="70" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
<text x="1550" y="198" text-anchor="middle" font-size="16" font-weight="600" fill="#134e4a">Unidades de medida</text>
<text x="1550" y="220" text-anchor="middle" font-size="16" font-weight="600" fill="#134e4a">de información</text>

<!-- ===================== CONECTORES NIVEL1 -> NIVEL2 ===================== -->
<g stroke="#9ca3af" stroke-width="1.2" fill="none">
  <line x1="150" y1="240" x2="150" y2="300"/>
  <line x1="150" y1="370" x2="150" y2="390"/>
  <line x1="430" y1="240" x2="430" y2="300"/>
  <line x1="430" y1="370" x2="430" y2="390"/>
  <line x1="710" y1="240" x2="710" y2="300"/>
  <line x1="710" y1="370" x2="710" y2="390"/>
  <line x1="990" y1="240" x2="990" y2="300"/>
  <line x1="990" y1="370" x2="990" y2="390"/>
  <line x1="1270" y1="240" x2="1270" y2="300"/>
  <line x1="1270" y1="370" x2="1270" y2="390"/>
  <line x1="1550" y1="240" x2="1550" y2="300"/>
  <line x1="1550" y1="370" x2="1550" y2="390"/>
</g>

<!-- etiquetas de enlace -->
<text x="150" y="273" text-anchor="middle" font-size="13" fill="#6b7280" font-style="italic">incluye</text>
<text x="430" y="273" text-anchor="middle" font-size="13" fill="#6b7280" font-style="italic">incluye</text>
<text x="710" y="273" text-anchor="middle" font-size="13" fill="#6b7280" font-style="italic">incluye</text>
<text x="990" y="273" text-anchor="middle" font-size="13" fill="#6b7280" font-style="italic">ejemplos</text>
<text x="1270" y="273" text-anchor="middle" font-size="13" fill="#6b7280" font-style="italic">se basa en</text>
<text x="1550" y="273" text-anchor="middle" font-size="13" fill="#6b7280" font-style="italic">van desde</text>

<!-- ===================== NIVEL 2: SUBCONCEPTOS ===================== -->
<!-- Columna 1 -->
<rect x="25" y="300" width="250" height="70" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="150" y="328" text-anchor="middle" font-size="15" fill="#1e3a8a">Señales continuas</text>
<text x="150" y="350" text-anchor="middle" font-size="15" fill="#1e3a8a">vs. discretas</text>

<rect x="25" y="390" width="250" height="70" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="150" y="418" text-anchor="middle" font-size="15" fill="#1e3a8a">Conversión A/D:</text>
<text x="150" y="440" text-anchor="middle" font-size="15" fill="#1e3a8a">muestreo y cuantización</text>

<!-- Columna 2 -->
<rect x="305" y="300" width="250" height="70" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
<text x="430" y="328" text-anchor="middle" font-size="15" fill="#14532d">Binario, octal, decimal,</text>
<text x="430" y="350" text-anchor="middle" font-size="15" fill="#14532d">hexadecimal</text>

<rect x="305" y="390" width="250" height="70" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
<text x="430" y="418" text-anchor="middle" font-size="15" fill="#14532d">Conversión entre</text>
<text x="430" y="440" text-anchor="middle" font-size="15" fill="#14532d">bases numéricas</text>

<!-- Columna 3 -->
<rect x="585" y="300" width="250" height="70" rx="10" fill="#ffffff" stroke="#7e22ce" stroke-width="1.2"/>
<text x="710" y="328" text-anchor="middle" font-size="15" fill="#581c87">Enteros: signo-magnitud,</text>
<text x="710" y="350" text-anchor="middle" font-size="15" fill="#581c87">complemento a 1 y 2</text>

<rect x="585" y="390" width="250" height="70" rx="10" fill="#ffffff" stroke="#7e22ce" stroke-width="1.2"/>
<text x="710" y="418" text-anchor="middle" font-size="15" fill="#581c87">Reales: coma flotante</text>
<text x="710" y="440" text-anchor="middle" font-size="15" fill="#581c87">(estándar IEEE 754)</text>

<!-- Columna 4 -->
<rect x="865" y="300" width="250" height="70" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.2"/>
<text x="990" y="328" text-anchor="middle" font-size="15" fill="#7c2d12">ASCII</text>
<text x="990" y="350" text-anchor="middle" font-size="15" fill="#7c2d12">(codificación de 7-8 bits)</text>

<rect x="865" y="390" width="250" height="70" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.2"/>
<text x="990" y="418" text-anchor="middle" font-size="15" fill="#7c2d12">Unicode / UTF-8</text>
<text x="990" y="440" text-anchor="middle" font-size="15" fill="#7c2d12">(estándar internacional)</text>

<!-- Columna 5 -->
<rect x="1145" y="300" width="250" height="70" rx="10" fill="#ffffff" stroke="#be123c" stroke-width="1.2"/>
<text x="1270" y="328" text-anchor="middle" font-size="15" fill="#881337">Operaciones AND,</text>
<text x="1270" y="350" text-anchor="middle" font-size="15" fill="#881337">OR, NOT</text>

<rect x="1145" y="390" width="250" height="70" rx="10" fill="#ffffff" stroke="#be123c" stroke-width="1.2"/>
<text x="1270" y="418" text-anchor="middle" font-size="15" fill="#881337">Puertas lógicas y</text>
<text x="1270" y="440" text-anchor="middle" font-size="15" fill="#881337">circuitos digitales</text>

<!-- Columna 6 -->
<rect x="1425" y="300" width="250" height="70" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
<text x="1550" y="328" text-anchor="middle" font-size="15" fill="#134e4a">Bit y byte</text>
<text x="1550" y="350" text-anchor="middle" font-size="15" fill="#134e4a">(unidades base)</text>

<rect x="1425" y="390" width="250" height="70" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
<text x="1550" y="418" text-anchor="middle" font-size="15" fill="#134e4a">Múltiplos: KB, MB,</text>
<text x="1550" y="440" text-anchor="middle" font-size="15" fill="#134e4a">GB, TB</text>

<!-- ===================== LÍNEA DE BASE / EJE COMÚN ===================== -->
<line x1="60" y1="490" x2="1640" y2="490" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="850" y="522" text-anchor="middle" font-size="15" fill="#4b5563" font-style="italic">
  Todo dato, sin importar su naturaleza, se traduce finalmente en secuencias de bits (0 y 1)
</text>

</svg>
</div>

</body>
</html>
